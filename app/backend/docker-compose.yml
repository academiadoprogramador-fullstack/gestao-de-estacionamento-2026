services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your shell}
    ports:
      - "14333:1433"
    volumes:
      - estacionamento-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your shell}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  estacionamento-sqlserver-data:
