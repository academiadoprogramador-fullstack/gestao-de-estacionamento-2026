<div class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-slate-900/60">
    <div class="mx-auto flex w-full max-w-5xl items-center justify-between gap-4 px-4 py-3">
      <a
        routerLink="/dashboard"
        class="flex items-center gap-2 text-sm font-semibold tracking-wide text-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
      >
        <svg lucideParkingSquare class="h-6 w-6 text-sky-400" aria-hidden="true"></svg>
        Gestão de Estacionamento
      </a>

      @if (sessao.autenticado()) {
        <nav class="flex items-center gap-2 text-sm" aria-label="Navegação principal">
          <a
            routerLink="/dashboard"
            routerLinkActive="text-sky-300"
            class="flex items-center gap-1.5 rounded-md px-2 py-1 text-slate-300 transition hover:text-sky-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
          >
            <svg lucideLayoutDashboard class="h-4 w-4" aria-hidden="true"></svg>
            Área de trabalho
          </a>
          <span class="text-slate-400">{{ sessao.estado()?.funcionario?.nome }}</span>
        </nav>
      }
    </div>
  </header>

  <router-outlet />
</div>
