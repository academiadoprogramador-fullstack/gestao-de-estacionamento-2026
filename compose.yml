# Infraestrutura local da Fase 1: somente SQL Server Developer.
# API e SPA executam no host, em origens HTTPS distintas.
# A senha administrativa é fornecida ao processo Compose por variável de
# ambiente; nunca é armazenada neste arquivo nem em .env versionado.
name: gestao-estacionamento

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no ambiente do processo Compose}
    ports:
      - "127.0.0.1:${SQL_PORT:-1433}:1433"
    volumes:
      - dados-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - rede-local
    restart: unless-stopped

volumes:
  dados-sql:

networks:
  rede-local:
    driver: bridge
