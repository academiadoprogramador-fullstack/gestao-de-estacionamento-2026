<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Relatórios por período</title>
<desc id="descricao">Protótipo com dados sintéticos. Consulte a cena editável e as regras no índice.</desc>
<defs><marker id="seta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#172554"/></marker></defs>
<rect x="0" y="0" width="1200" height="900" rx="8" fill="#ffffff" stroke="#ffffff"/>
<text x="32" y="50" font-family="Arial, sans-serif" font-size="30" fill="#172554">
<tspan x="32" dy="0">Relatórios por período</tspan>
</text>
<text x="32" y="80" font-family="Arial, sans-serif" font-size="16" fill="#475569">
<tspan x="32" dy="0">PROTÓTIPO · Administrador · dados sintéticos</tspan>
</text>
<rect x="32" y="104" width="1136" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="48" y="135" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="48" dy="0">Gestão de Estacionamento  /  Administrador</tspan>
</text>
<text x="32" y="840" font-family="Arial, sans-serif" font-size="16" fill="#475569">
<tspan x="32" dy="0">RF-12 · RNF-02/05 · TDD §5.3</tspan>
</text>
<text x="32" y="870" font-family="Arial, sans-serif" font-size="16" fill="#475569">
<tspan x="32" dy="0">Wireframe de discussão. Não é interface executável nem evidência de conformidade.</tspan>
</text>
<rect x="32" y="176" width="728" height="606" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="52" y="212" font-family="Arial, sans-serif" font-size="18" fill="#475569">
<tspan x="52" dy="0">Relatórios · rota visual a especificar</tspan>
</text>
<rect x="52" y="240" width="688" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="261" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="66" dy="0">Período | Dia / Semana / Mês</tspan>
</text>
<rect x="52" y="296" width="688" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="317" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="66" dy="0">Data | 16/11/2026 · America/Sao_Paulo</tspan>
</text>
<rect x="52" y="352" width="688" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="373" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="66" dy="0">Recebimentos | bruto R$ 40,00 · estornos R$ 0,00</tspan>
</text>
<rect x="52" y="408" width="688" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="429" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="66" dy="0">Recebido líquido | R$ 40,00</tspan>
</text>
<rect x="52" y="464" width="688" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="485" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="66" dy="0">Cobranças | bruto R$ 60,00 · descontos R$ 0,00</tspan>
</text>
<rect x="52" y="520" width="688" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="541" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="66" dy="0">Saldo na data de corte | R$ 20,00</tspan>
</text>
<rect x="52" y="576" width="688" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="597" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="66" dy="0">Operação | entradas / entregas / ocupação</tspan>
</text>
<rect x="52" y="632" width="688" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="653" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="66" dy="0">Detalhamento | componentes e recortes separados</tspan>
</text>
<rect x="784" y="176" width="384" height="382" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="804" y="216" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="804" dy="0">Regras e permissões</tspan>
</text>
<text x="804" y="260" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="804" dy="0">Valores sintéticos, não medição</tspan>
<tspan x="804" dy="22.5">real.</tspan>
</text>
<text x="804" y="308" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="804" dy="0">Semana: segunda a domingo.</tspan>
</text>
<text x="804" y="356" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="804" dy="0">Lançamentos pelo horário de cada</tspan>
<tspan x="804" dy="22.5">evento.</tspan>
</text>
<text x="804" y="404" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="804" dy="0">Início inclusivo; fim exclusivo.</tspan>
</text>
<text x="804" y="452" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="804" dy="0">Dívida após entrega continua no</tspan>
<tspan x="804" dy="22.5">saldo.</tspan>
</text>
<text x="804" y="500" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="804" dy="0">Sem módulo de fechamento/fiscal.</tspan>
</text>
<rect x="784" y="582" width="384" height="200" rx="8" fill="#fff7ed" stroke="#c2410c"/>
<text x="804" y="622" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="804" dy="0">Estado / bloqueio</tspan>
</text>
<text x="804" y="664" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="804" dy="0">Líquido do período pode ser</tspan>
<tspan x="804" dy="22.5">negativo.</tspan>
</text>
<text x="804" y="719" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="804" dy="0">Histórico descartado não aparece</tspan>
<tspan x="804" dy="22.5">como zero observado.</tspan>
</text>
<rect x="52" y="718" width="198" height="48" rx="8" fill="#bfdbfe" stroke="#2563eb"/>
<text x="64" y="749" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="64" dy="0">Consultar</tspan>
<tspan x="64" dy="22.5">período</tspan>
</text>
</svg>
