<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Fluxo de bloqueios e exceções</title>
<desc id="descricao">Protótipo com dados sintéticos. Consulte a cena editável e as regras no índice.</desc>
<defs><marker id="seta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#172554"/></marker></defs>
<rect x="0" y="0" width="1200" height="900" rx="8" fill="#ffffff" stroke="#ffffff"/>
<text x="32" y="50" font-family="Arial, sans-serif" font-size="30" fill="#172554">
<tspan x="32" dy="0">Fluxo de bloqueios e exceções</tspan>
</text>
<text x="32" y="80" font-family="Arial, sans-serif" font-size="16" fill="#475569">
<tspan x="32" dy="0">PROTÓTIPO · Fluxo de referência · dados sintéticos</tspan>
</text>
<rect x="32" y="104" width="1136" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="48" y="135" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="48" dy="0">Gestão de Estacionamento  /  Fluxo de referência</tspan>
</text>
<text x="32" y="840" font-family="Arial, sans-serif" font-size="16" fill="#475569">
<tspan x="32" dy="0">RF-04/08/09/10/11 · PRD §5.4–5.5</tspan>
</text>
<text x="32" y="870" font-family="Arial, sans-serif" font-size="16" fill="#475569">
<tspan x="32" dy="0">Wireframe de discussão. Não é interface executável nem evidência de conformidade.</tspan>
</text>
<rect x="32" y="188" width="352" height="152" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="48" y="226" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="48" dy="0">1. Titular presente?</tspan>
</text>
<text x="48" y="278" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="48" dy="0">Não: bloquear, inclusive para</tspan>
<tspan x="48" dy="22.5">admin.</tspan>
</text>
<path d="M384 264 l36 0" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#seta)"/>
<rect x="420" y="188" width="352" height="152" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="436" y="226" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="436" dy="0">2. Pedido existente?</tspan>
</text>
<text x="436" y="278" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="436" dy="0">Não: registrar pedido antes da</tspan>
<tspan x="436" dy="22.5">entrega.</tspan>
</text>
<path d="M772 264 l36 0" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#seta)"/>
<rect x="808" y="188" width="352" height="152" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="824" y="226" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="824" dy="0">3. Conferência aprovada?</tspan>
</text>
<text x="824" y="278" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="824" dy="0">Não: exigir exceção documental</tspan>
<tspan x="824" dy="22.5">vigente.</tspan>
</text>
<path d="M984 340 l0 44" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#seta)"/>
<rect x="808" y="384" width="352" height="152" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="824" y="422" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="824" dy="0">4. Saldo zero?</tspan>
</text>
<text x="824" y="474" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="824" dy="0">Não: pagar integral OU exceção</tspan>
<tspan x="824" dy="22.5">financeira.</tspan>
</text>
<path d="M808 460 l-36 0" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#seta)"/>
<rect x="420" y="384" width="352" height="152" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="436" y="422" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="436" dy="0">5. Vistoria textual</tspan>
<tspan x="436" dy="27.5">salva?</tspan>
</text>
<text x="436" y="474" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="436" dy="0">Não: registrar condições de</tspan>
<tspan x="436" dy="22.5">saída.</tspan>
</text>
<path d="M420 460 l-36 0" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#seta)"/>
<rect x="32" y="384" width="352" height="152" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="48" y="422" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="48" dy="0">6. Exceções atuais?</tspan>
</text>
<text x="48" y="474" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="48" dy="0">Revogada/substituída/obsoleta:</tspan>
<tspan x="48" dy="22.5">bloquear.</tspan>
</text>
<path d="M208 536 l0 44" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#seta)"/>
<rect x="32" y="580" width="352" height="152" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="48" y="618" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="48" dy="0">7. Confirmar entrega</tspan>
</text>
<text x="48" y="670" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="48" dy="0">Caixa/admin, com ação</tspan>
<tspan x="48" dy="22.5">explícita.</tspan>
</text>
<path d="M384 656 l36 0" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#seta)"/>
<rect x="420" y="580" width="352" height="152" rx="8" fill="#eff6ff" stroke="#2563eb"/>
<text x="436" y="618" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="436" dy="0">8. Consumir uma vez</tspan>
</text>
<text x="436" y="670" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="436" dy="0">Validar, encerrar e liberar</tspan>
<tspan x="436" dy="22.5">atomicamente.</tspan>
</text>
<path d="M772 656 l36 0" fill="none" stroke="#172554" stroke-width="2" marker-end="url(#seta)"/>
<rect x="808" y="580" width="352" height="152" rx="8" fill="#dcfce7" stroke="#2563eb"/>
<text x="824" y="618" font-family="Arial, sans-serif" font-size="22" fill="#172554">
<tspan x="824" dy="0">9. Saldo posterior</tspan>
</text>
<text x="824" y="670" font-family="Arial, sans-serif" font-size="18" fill="#172554">
<tspan x="824" dy="0">Acerto integral sem reabrir</tspan>
<tspan x="824" dy="22.5">vaga/pedido.</tspan>
</text>
<text x="32" y="794" font-family="Arial, sans-serif" font-size="16" fill="#475569">
<tspan x="32" dy="0">Cada bloqueio interrompe a entrega. Sanado o requisito, reavaliar os demais. Exceção não quita nem corrige documento.</tspan>
</text>
</svg>
